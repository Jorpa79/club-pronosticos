<style>:root{--n:#173f69;--bg:#f3f6fa;--line:#d7e0e8;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#243447}header{background:var(--n);color:#fff;padding:16px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between}header small{display:block;font-size:12px;margin-left:28px}main{max-width:1050px;margin:24px auto;padding:0 16px}.hidden{display:none!important}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.nav,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;background:var(--n);color:#fff;padding:10px 15px;font-weight:700}.secondary{background:#eef4fb;color:var(--n);border:1px solid #aac1d9}.danger{background:var(--red)}.ghost{background:transparent;border:1px solid #aac1d9}input{width:100%;padding:11px;border:1px solid #c9d4df;border-radius:8px;margin:5px 0 12px}.grid,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.stat{font-size:28px;font-weight:800}.stat small{display:block;font-size:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}th{background:#eef4fb}.badge{padding:4px 8px;background:#e9eef4;border-radius:15px}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.pick{display:flex;gap:6px}.pick input{width:auto;margin:0}.auth{max-width:460px;margin:40px auto}#toast{position:fixed;right:18px;bottom:18px;background:#172334;color:#fff;padding:12px 16px;border-radius:10px;display:none}@media(max-width:700px){.grid,.stats,.match{grid-template-columns:1fr}}</style>
